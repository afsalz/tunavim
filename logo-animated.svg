<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 1092" width="263" height="273">
 <defs>
  <linearGradient id="tunaShimmer" x1="0" y1="0" x2="1" y2="0.4">
   <stop offset="0" stop-color="#B9253D"/>
   <stop offset="0.5" stop-color="#B9253D">
    <animate attributeName="stop-color" values="#B9253D;#E8536F;#B9253D" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="offset" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/>
   </stop>
   <stop offset="1" stop-color="#B9253D"/>
  </linearGradient>
 </defs>

 <!-- bubbles drifting up from the fish's mouth -->
 <g fill="#B9253D">
  <circle cx="880" cy="0" r="14" opacity="0">
   <animate attributeName="cy" values="330;80" dur="3.5s" begin="0s" repeatCount="indefinite"/>
   <animate attributeName="opacity" values="0;0.5;0.4;0" dur="3.5s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="0" r="9" opacity="0">
   <animate attributeName="cy" values="300;60" dur="4.2s" begin="1.3s" repeatCount="indefinite"/>
   <animate attributeName="opacity" values="0;0.45;0.35;0" dur="4.2s" begin="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="845" cy="0" r="7" opacity="0">
   <animate attributeName="cy" values="340;110" dur="3s" begin="2.2s" repeatCount="indefinite"/>
   <animate attributeName="opacity" values="0;0.4;0.3;0" dur="3s" begin="2.2s" repeatCount="indefinite"/>
  </circle>
 </g>

